<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FGV Automation | Acceso</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #090b10;
      color: #f5f5f5;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .login-container {
      width: 100%;
      max-width: 460px;
      padding: 24px;
    }

    .login-card {
      background: #171a21;
      border: 1px solid #2c313c;
      border-radius: 18px;
      padding: 42px;
    }

    .brand {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 6px;
      color: #9ca3af;
      margin-bottom: 38px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      line-height: 1.1;
    }

    .subtitle {
      margin: 0 0 32px;
      color: #9ca3af;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #c7cbd3;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border-radius: 10px;
      border: 1px solid #343946;
      background: #0d0f14;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #6ee7b7;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #6ee7b7;
      color: #08110d;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-message {
      display: none;
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      font-size: 14px;
    }

    .loading-message {
      display: none;
      margin-top: 20px;
      color: #9ca3af;
      text-align: center;
      font-size: 14px;
    }

  </style>
</head>

<body>

  <main class="login-container">

    <section class="login-card">

      <div class="brand">
        FGV AUTOMATION
      </div>

      <h1>
        Accede a tu cuenta
      </h1>

      <p class="subtitle">
        Gestiona las reservas y la configuración de tu restaurante.
      </p>

      <form id="loginForm">

        <div class="field">

          <label for="email">
            Correo electrónico
          </label>

          <input
            id="email"
            type="email"
            required
            autocomplete="email"
          >

        </div>

        <div class="field">

          <label for="password">
            Contraseña
          </label>

          <input
            id="password"
            type="password"
            required
            autocomplete="current-password"
          >

        </div>

        <button
          id="loginButton"
          type="submit"
        >
          Iniciar sesión
        </button>

      </form>

      <div
        id="loadingMessage"
        class="loading-message"
      >
        Comprobando acceso...
      </div>

      <div
        id="errorMessage"
        class="error-message"
      ></div>

    </section>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    /*
    =======================================
    CONFIGURACIÓN SUPABASE
    =======================================
    */

    const SUPABASE_URL =
      "https://ehimrfhysnnickpdtqg.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_oz9UHM_4VYm-RqWerIYOSg_YFOBxO24";


    /*
    =======================================
    CLIENTE SUPABASE
    =======================================
    */

    const supabase =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /*
    =======================================
    ELEMENTOS
    =======================================
    */

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const errorMessage =
      document.getElementById("errorMessage");

    const loadingMessage =
      document.getElementById("loadingMessage");


    /*
    =======================================
    LOGIN
    =======================================
    */

    loginForm.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();


        /*
        =======================================
        RESET INTERFAZ
        =======================================
        */

        errorMessage.style.display =
          "none";

        loadingMessage.style.display =
          "block";

        loginButton.disabled =
          true;

        loginButton.textContent =
          "Accediendo...";


        /*
        =======================================
        DATOS DEL FORMULARIO
        =======================================
        */

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        try {

          /*
          =======================================
          INICIAR SESIÓN
          =======================================
          */

          const {
            data: authData,
            error: authError
          } =
            await supabase.auth.signInWithPassword({
              email: email,
              password: password
            });


          if (authError) {
            throw authError;
          }


          if (
            !authData ||
            !authData.user
          ) {

            throw new Error(
              "No se ha podido identificar al usuario."
            );

          }


          const userId =
            authData.user.id;


          console.log(
            "USUARIO AUTENTICADO:",
            userId
          );


          /*
          =======================================
          BUSCAR PERFIL
          =======================================
          */

          const {
            data: profile,
            error: profileError
          } =
            await supabase
              .from("profiles")
              .select("*")
              .eq(
                "id",
                userId
              )
              .maybeSingle();


          if (profileError) {
            throw profileError;
          }


          if (!profile) {

            throw new Error(
              "No existe un perfil asociado a este usuario."
            );

          }


          console.log(
            "PERFIL:",
            profile
          );


          /*
          =======================================
          BUSCAR ACCESOS A RESTAURANTES
          =======================================

          Esto se consulta incluso para el
          superadmin.

          Así tú puedes entrar como superadmin
          global y también tener acceso al
          restaurante de prueba como owner.
          */

          const {
            data: establishments,
            error: establishmentsError
          } =
            await supabase
              .from("establishment_users")
              .select(
                "establishment_id, role"
              )
              .eq(
                "user_id",
                userId
              );


          if (establishmentsError) {
            throw establishmentsError;
          }


          console.log(
            "ACCESOS A RESTAURANTES:",
            establishments
          );


          /*
          =======================================
          SUPERADMIN
          =======================================
          */

          if (
            profile.role ===
            "superadmin"
          ) {

            console.log(
              "ACCESO SUPERADMIN"
            );


            /*
            De momento usamos el restaurante
            asociado si existe.

            Más adelante crearemos:

            admin.html

            que será tu dashboard maestro.
            */

            if (
              establishments &&
              establishments.length > 0
            ) {

              window.location.href =
                "dashboard.html?id=" +
                encodeURIComponent(
                  establishments[0].establishment_id
                );

              return;

            }


            /*
            Si eres superadmin pero todavía
            no tienes restaurante asociado.
            */

            window.location.href =
              "dashboard.html?admin=true";

            return;

          }


          /*
          =======================================
        USUARIO DE RESTAURANTE
          =======================================
          */

          if (
            !establishments ||
            establishments.length === 0
          ) {

            throw new Error(
              "Este usuario no tiene acceso a ningún restaurante."
            );

          }


          /*
          =======================================
          REDIRECCIÓN AL RESTAURANTE
          =======================================
          */

          window.location.href =
            "dashboard.html?id=" +
            encodeURIComponent(
              establishments[0].establishment_id
            );


        } catch (error) {

          console.error(
            "ERROR EN LOGIN:",
            error
          );


          let message =
            "No se ha podido iniciar sesión.";


          if (
            error &&
            error.message
          ) {

            message =
              error.message;

          }


          errorMessage.textContent =
            message;

          errorMessage.style.display =
            "block";


        } finally {

          loadingMessage.style.display =
            "none";

          loginButton.disabled =
            false;

          loginButton.textContent =
            "Iniciar sesión";

        }

      }
    );

  </script>

</body>
</html>
