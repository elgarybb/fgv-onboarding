<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FGV Automation | Acceso</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0e14;
      color: #f5f7fa;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }


    .card {
      width: 100%;
      max-width: 520px;
      background: #1b1f27;
      border: 1px solid #303744;
      border-radius: 18px;
      padding: 40px;
    }


    .brand {
      font-size: 12px;
      letter-spacing: 7px;
      font-weight: bold;
      color: #aeb6c2;
      margin-bottom: 32px;
    }


    h1 {
      margin: 0 0 10px;
      font-size: 34px;
    }


    .subtitle {
      color: #aeb6c2;
      line-height: 1.6;
      margin-bottom: 30px;
    }


    label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      color: #d7dce3;
      font-weight: bold;
    }


    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 10px;
      border: 1px solid #3a4352;
      background: #0f131a;
      color: white;
      font-size: 16px;
      outline: none;
    }


    input:focus {
      border-color: #7ed7bd;
    }


    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #7ed7bd;
      color: #102018;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }


    button:hover {
      opacity: 0.9;
    }


    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }


    .forgot {
      display: block;
      width: 100%;
      margin-top: 18px;
      background: transparent;
      color: #aeb6c2;
      padding: 8px;
      font-size: 14px;
      font-weight: normal;
      border: none;
      cursor: pointer;
    }


    .forgot:hover {
      color: #ffffff;
      opacity: 1;
    }


    .register-section {
      margin-top: 28px;
      padding-top: 25px;
      border-top: 1px solid #303744;
      text-align: center;
    }


    .register-text {
      color: #aeb6c2;
      font-size: 14px;
      margin-bottom: 14px;
    }


    .register-button {
      display: block;
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #7ed7bd;
      background: transparent;
      color: #7ed7bd;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
      transition: 0.2s;
    }


    .register-button:hover {
      background: rgba(126, 215, 189, 0.08);
    }


    .message {
      display: none;
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }


    .success {
      background: rgba(80, 200, 140, 0.12);
      border: 1px solid #3b9b73;
      color: #8be0bd;
    }


    .error {
      background: rgba(220, 80, 80, 0.12);
      border: 1px solid #a94d4d;
      color: #ff9a9a;
    }

  </style>

</head>


<body>


  <div class="card">


    <div class="brand">

      FGV AUTOMATION

    </div>


    <h1>

      Accede a tu cuenta

    </h1>


    <p class="subtitle">

      Gestiona las reservas y la configuración de tu restaurante.

    </p>



    <!-- ========================== -->
    <!-- LOGIN -->
    <!-- ========================== -->

    <form id="loginForm">


      <label for="email">

        Correo electrónico

      </label>


      <input
        type="email"
        id="email"
        placeholder="tu@email.com"
        required
      >



      <label for="password">

        Contraseña

      </label>


      <input
        type="password"
        id="password"
        placeholder="Introduce tu contraseña"
        required
      >



      <button
        type="submit"
        id="loginButton"
      >

        Iniciar sesión

      </button>


    </form>



    <!-- ========================== -->
    <!-- RESET PASSWORD -->
    <!-- ========================== -->

    <button
      type="button"
      id="resetButton"
      class="forgot"
    >

      ¿Has olvidado tu contraseña?

    </button>



    <!-- ========================== -->
    <!-- MENSAJES -->
    <!-- ========================== -->

    <div
      id="message"
      class="message"
    ></div>



    <!-- ========================== -->
    <!-- CREAR CUENTA -->
    <!-- ========================== -->

    <div class="register-section">


      <div class="register-text">

        ¿Todavía no tienes cuenta?

      </div>


      <a
        href="register.html"
        class="register-button"
      >

        Crear cuenta

      </a>


    </div>


  </div>



  <!-- ========================== -->
  <!-- SUPABASE -->
  <!-- ========================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



  <script>


    /*
    ==========================================
    CONFIGURACIÓN SUPABASE
    ==========================================
    */

    const SUPABASE_URL =
      "https://ehifmrfhysnnikcpdtqg.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_oz9UHM_4VYm-RqWerIYOSg_YFOBxO24";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );



    /*
    ==========================================
    ELEMENTOS
    ==========================================
    */

    const loginForm =
      document.getElementById("loginForm");


    const emailInput =
      document.getElementById("email");


    const passwordInput =
      document.getElementById("password");


    const loginButton =
      document.getElementById("loginButton");


    const resetButton =
      document.getElementById("resetButton");


    const message =
      document.getElementById("message");



    /*
    ==========================================
    MOSTRAR MENSAJE
    ==========================================
    */

    function showMessage(text, type) {

      message.style.display =
        "block";

      message.textContent =
        text;

      message.className =
        "message " + type;

    }



    /*
    ==========================================
    INICIAR SESIÓN
    ==========================================
    */

    loginForm.addEventListener(
      "submit",

      async function(event) {

        event.preventDefault();


        const email =
          emailInput.value.trim();


        const password =
          passwordInput.value;



        if (!email || !password) {

          showMessage(
            "Introduce tu correo y contraseña.",
            "error"
          );

          return;

        }



        loginButton.disabled =
          true;


        loginButton.textContent =
          "Iniciando sesión...";



        const {
          data,
          error
        } =
          await supabaseClient
            .auth
            .signInWithPassword({

              email: email,

              password: password

            });



        if (error) {

          showMessage(
            error.message,
            "error"
          );


          loginButton.disabled =
            false;


          loginButton.textContent =
            "Iniciar sesión";


          return;

        }



        showMessage(
          "Inicio de sesión correcto. Redirigiendo...",
          "success"
        );



        setTimeout(
          function() {

            window.location.href =
              "dashboard.html";

          },
          500
        );

      }

    );



    /*
    ==========================================
    RESTABLECER CONTRASEÑA
    ==========================================
    */

    resetButton.addEventListener(
      "click",

      async function() {

        const email =
          emailInput.value.trim();



        if (!email) {

          showMessage(
            "Introduce primero tu correo electrónico para restablecer la contraseña.",
            "error"
          );

          return;

        }



        resetButton.disabled =
          true;


        resetButton.textContent =
          "Enviando enlace...";



        const {
          error
        } =
          await supabaseClient
            .auth
            .resetPasswordForEmail(
              email,
              {
                redirectTo:
                  "https://elgarybb.github.io/fgv-onboarding/reset-password.html"
              }
            );



        if (error) {

          showMessage(
            error.message,
            "error"
          );


          resetButton.disabled =
            false;


          resetButton.textContent =
            "¿Has olvidado tu contraseña?";


          return;

        }



        showMessage(
          "Te hemos enviado un enlace para crear una nueva contraseña. Revisa tu correo.",
          "success"
        );



        resetButton.disabled =
          false;


        resetButton.textContent =
          "¿Has olvidado tu contraseña?";

      }

    );


  </script>


</body>

</html>
