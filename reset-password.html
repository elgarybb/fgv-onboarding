<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Restablecer contraseña | FGV Automation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0e14;
      color: #f5f7fa;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #1b1f27;
      border: 1px solid #303744;
      border-radius: 18px;
      padding: 40px;
    }

    .brand {
      font-size: 12px;
      letter-spacing: 7px;
      font-weight: bold;
      color: #aeb6c2;
      margin-bottom: 32px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 34px;
    }

    .subtitle {
      color: #aeb6c2;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      color: #d7dce3;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 10px;
      border: 1px solid #3a4352;
      background: #0f131a;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #7ed7bd;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #7ed7bd;
      color: #102018;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      background: rgba(80, 200, 140, 0.12);
      border: 1px solid #3b9b73;
      color: #8be0bd;
    }

    .error {
      background: rgba(220, 80, 80, 0.12);
      border: 1px solid #a94d4d;
      color: #ff9a9a;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #aeb6c2;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: #ffffff;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="brand">FGV AUTOMATION</div>

    <h1>Crea una nueva contraseña</h1>

    <p class="subtitle">
      Introduce y confirma tu nueva contraseña para recuperar el acceso a tu cuenta.
    </p>

    <form id="resetForm">

      <label for="password">
        Nueva contraseña
      </label>

      <input
        type="password"
        id="password"
        placeholder="Introduce tu nueva contraseña"
        required
        minlength="6"
      >

      <label for="confirmPassword">
        Confirmar nueva contraseña
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Repite tu nueva contraseña"
        required
        minlength="6"
      >

      <button type="submit" id="submitButton">
        Guardar nueva contraseña
      </button>

    </form>

    <div id="message" class="message"></div>

    <a href="login.html" class="back">
      Volver al inicio de sesión
    </a>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL = "https://heifmrfhysnnikcpdtqg.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_oz9UHM_4VYm-RqWerIYOSg_YFOBxO24";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const form =
      document.getElementById("resetForm");

    const passwordInput =
      document.getElementById("password");

    const confirmPasswordInput =
      document.getElementById("confirmPassword");

    const button =
      document.getElementById("submitButton");

    const message =
      document.getElementById("message");


    function showMessage(text, type) {

      message.style.display = "block";

      message.textContent = text;

      message.className =
        "message " + type;

    }


    form.addEventListener(
      "submit",

      async function(event) {

        event.preventDefault();


        const password =
          passwordInput.value;

        const confirmPassword =
          confirmPasswordInput.value;


        if (password !== confirmPassword) {

          showMessage(
            "Las contraseñas no coinciden.",
            "error"
          );

          return;

        }


        if (password.length < 6) {

          showMessage(
            "La contraseña debe tener al menos 6 caracteres.",
            "error"
          );

          return;

        }


        button.disabled = true;

        button.textContent =
          "Guardando...";


        const {
          data: sessionData,
          error: sessionError
        } =
          await supabaseClient.auth.getSession();


        if (
          sessionError ||
          !sessionData.session
        ) {

          showMessage(
            "El enlace de recuperación no es válido o ha caducado. Solicita uno nuevo.",
            "error"
          );

          button.disabled = false;

          button.textContent =
            "Guardar nueva contraseña";

          return;

        }


        const {
          error
        } =
          await supabaseClient.auth.updateUser({
            password: password
          });


        if (error) {

          showMessage(
            error.message,
            "error"
          );

          button.disabled = false;

          button.textContent =
            "Guardar nueva contraseña";

          return;

        }


        showMessage(
          "Contraseña actualizada correctamente. Serás redirigido al inicio de sesión.",
          "success"
        );


        setTimeout(
          function() {

            window.location.href =
              "login.html";

          },

          2000
        );

      }

    );

  </script>

</body>
</html>
